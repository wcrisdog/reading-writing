<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 AI 反馈数据仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-meta {
            font-size: 12px;
            color: #999;
        }

        .content-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: #f5f5f5;
            color: #333;
        }

        table th,
        table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .sentiment {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }

        .sentiment.like {
            background: #d4edda;
            color: #155724;
        }

        .sentiment.dislike {
            background: #f8d7da;
            color: #721c24;
        }

        .content-type {
            display: inline-block;
            padding: 4px 8px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 4px;
            font-size: 12px;
        }

        .chart-container {
            margin-top: 30px;
        }

        .bar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .bar-label {
            width: 120px;
            padding-right: 15px;
            text-align: right;
            font-weight: 500;
            color: #333;
        }

        .bar-wrapper {
            flex: 1;
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            height: 30px;
        }

        .bar-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 500;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 AI 反馈数据仪表板</h1>
            <p>实时监控用户对 AI 生成内容的评价</p>
        </div>

        <!-- 统计信息 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>总反馈数</h3>
                <div class="stat-value" id="totalFeedbacks">-</div>
                <div class="stat-meta">条反馈记录</div>
            </div>
            <div class="stat-card">
                <h3>点赞数</h3>
                <div class="stat-value" id="totalLikes">-</div>
                <div class="stat-meta">用户认可的内容</div>
            </div>
            <div class="stat-card">
                <h3>点踩数</h3>
                <div class="stat-value" id="totalDislikes">-</div>
                <div class="stat-meta">需改进的内容</div>
            </div>
            <div class="stat-card">
                <h3>满意度</h3>
                <div class="stat-value" id="likeRatio">-</div>
                <div class="stat-meta">点赞率</div>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="content-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('content-dist')">📝 内容类型分布</button>
                <button class="tab-btn" onclick="switchTab('user-dist')">👥 用户分布</button>
                <button class="tab-btn" onclick="switchTab('all-feedbacks')">📋 所有反馈</button>
            </div>

            <!-- 内容类型分布 -->
            <div id="content-dist-tab" class="tab-content">
                <div class="chart-container" id="contentDistChart">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 用户分布 -->
            <div id="user-dist-tab" class="tab-content" style="display: none;">
                <table id="userDistTable">
                    <thead>
                        <tr>
                            <th>用户ID</th>
                            <th>用户名</th>
                            <th>反馈总数</th>
                            <th>点赞数</th>
                            <th>点赞率</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 所有反馈 -->
            <div id="all-feedbacks-tab" class="tab-content" style="display: none;">
                <table id="feedbacksTable">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>用户</th>
                            <th>类型</th>
                            <th>评价</th>
                            <th>文章</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="loading">加载中...</td>
                        </tr>
                    </tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/query-feedback';
        let currentPage = 1;

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}?action=user-stats`);
                const data = await res.json();

                if (data.success) {
                    document.getElementById('totalFeedbacks').textContent = data.data.total || 0;
                    document.getElementById('totalLikes').textContent = data.data.likes || 0;
                    document.getElementById('totalDislikes').textContent = data.data.dislikes || 0;
                    document.getElementById('likeRatio').textContent = 
                        ((data.data.likeRatio || 0) * 100).toFixed(1) + '%';
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        async function loadContentDistribution() {
            try {
                const res = await fetch(`${API_BASE}?action=content-distribution`);
                const data = await res.json();

                if (data.success) {
                    const maxCount = Math.max(...data.data.map(d => d.count));
                    const html = data.data.map(item => {
                        const percentage = (item.count / maxCount) * 100;
                        const likeRate = item.count > 0 
                            ? ((item.likes / item.count) * 100).toFixed(0) 
                            : 0;
                        return `
                            <div class="bar">
                                <div class="bar-label">${item._id}</div>
                                <div class="bar-wrapper">
                                    <div class="bar-fill" style="width: ${percentage}%">
                                        ${item.count} (赞: ${likeRate}%)
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    document.getElementById('contentDistChart').innerHTML = html || '<p class="loading">暂无数据</p>';
                }
            } catch (error) {
                console.error('加载内容分布失败:', error);
            }
        }

        async function loadUserDistribution() {
            try {
                const res = await fetch(`${API_BASE}?action=user-distribution`);
                const data = await res.json();

                if (data.success && data.data.length > 0) {
                    const tbody = document.querySelector('#userDistTable tbody');
                    const html = data.data.map(user => {
                        const likeRate = user.feedbackCount > 0 
                            ? ((user.likes / user.feedbackCount) * 100).toFixed(0)
                            : 0;
                        return `
                            <tr>
                                <td>${user._id.userId.substring(0, 8)}</td>
                                <td>${user._id.username}</td>
                                <td>${user.feedbackCount}</td>
                                <td>${user.likes}</td>
                                <td>${likeRate}%</td>
                            </tr>
                        `;
                    }).join('');
                    tbody.innerHTML = html;
                } else {
                    document.querySelector('#userDistTable tbody').innerHTML = 
                        '<tr><td colspan="5" class="loading">暂无数据</td></tr>';
                }
            } catch (error) {
                console.error('加载用户分布失败:', error);
            }
        }

        async function loadFeedbacks(page = 1) {
            try {
                const res = await fetch(`${API_BASE}?action=all-feedbacks&page=${page}&limit=10`);
                const data = await res.json();

                if (data.success && data.data.feedbacks.length > 0) {
                    const tbody = document.querySelector('#feedbacksTable tbody');
                    const html = data.data.feedbacks.map(feedback => `
                        <tr>
                            <td>${new Date(feedback.timestamp).toLocaleString('zh-CN')}</td>
                            <td>${feedback.username}</td>
                            <td><span class="content-type">${feedback.feedback.contentType}</span></td>
                            <td><span class="sentiment ${feedback.feedback.sentiment}">
                                ${feedback.feedback.sentiment === 'like' ? '👍 有用' : '👎 需改进'}
                            </span></td>
                            <td>${feedback.article.title}</td>
                        </tr>
                    `).join('');
                    tbody.innerHTML = html;

                    // 分页
                    const totalPages = data.data.totalPages;
                    const pagination = document.getElementById('pagination');
                    pagination.innerHTML = `
                        <button onclick="loadFeedbacks(${Math.max(1, page - 1)})" ${page === 1 ? 'disabled' : ''}>← 上一页</button>
                        <span style="padding: 8px 16px;">第 ${page} / ${totalPages} 页</span>
                        <button onclick="loadFeedbacks(${Math.min(totalPages, page + 1)})" ${page === totalPages ? 'disabled' : ''}>下一页 →</button>
                    `;
                } else {
                    document.querySelector('#feedbacksTable tbody').innerHTML = 
                        '<tr><td colspan="5" class="loading">暂无数据</td></tr>';
                }
            } catch (error) {
                console.error('加载反馈失败:', error);
            }
        }

        function switchTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 显示选中的标签页
            document.getElementById(tabName + '-tab').style.display = 'block';
            event.target.classList.add('active');

            // 加载对应数据
            if (tabName === 'content-dist') loadContentDistribution();
            if (tabName === 'user-dist') loadUserDistribution();
            if (tabName === 'all-feedbacks') loadFeedbacks(1);
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadContentDistribution();
        });

        // 每30秒刷新一次数据
        setInterval(() => {
            loadStats();
        }, 30000);
    </script>
</body>
</html>
